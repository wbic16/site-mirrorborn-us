<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="scroll" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#88C0D0"/>
      <stop offset="100%" stop-color="#5E81AC"/>
    </linearGradient>
    <linearGradient id="section" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A3BE8C"/>
      <stop offset="100%" stop-color="#689d6a"/>
    </linearGradient>
    <linearGradient id="chapter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBCB8B"/>
      <stop offset="100%" stop-color="#d08770"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B48EAD"/>
      <stop offset="100%" stop-color="#8b5e83"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" fill="#88C0D0" font-size="18" text-anchor="middle" font-weight="bold">Phext: Every Node is a Leaf</text>
  <text x="450" y="55" fill="#666" font-size="12" text-anchor="middle">No tree. No hierarchy at rest. Just a linked list of scrolls with delimiter boundaries.</text>

  <!-- ═══ LEFT SIDE: 1D Storage (at rest) ═══ -->
  <text x="30" y="90" fill="#EBCB8B" font-size="14" font-weight="bold">AT REST: Linear Stream</text>
  <text x="30" y="108" fill="#666" font-size="11">Scrolls separated by delimiters (0x17-0x01)</text>

  <!-- Linear scroll chain -->
  <g transform="translate(30, 125)">
    <!-- Scrolls as boxes -->
    <rect x="0" y="0" width="60" height="30" rx="4" fill="url(#scroll)" opacity="0.9"/>
    <text x="30" y="20" fill="#1a1a2e" font-size="10" text-anchor="middle">1.1.1</text>

    <text x="68" y="20" fill="#A3BE8C" font-size="16">|</text>
    <text x="65" y="42" fill="#A3BE8C" font-size="8">0x17</text>

    <rect x="80" y="0" width="60" height="30" rx="4" fill="url(#scroll)" opacity="0.9"/>
    <text x="110" y="20" fill="#1a1a2e" font-size="10" text-anchor="middle">1.1.2</text>

    <text x="148" y="20" fill="#A3BE8C" font-size="16">|</text>
    <text x="145" y="42" fill="#A3BE8C" font-size="8">0x17</text>

    <rect x="160" y="0" width="60" height="30" rx="4" fill="url(#scroll)" opacity="0.9"/>
    <text x="190" y="20" fill="#1a1a2e" font-size="10" text-anchor="middle">1.1.3</text>

    <text x="228" y="20" fill="#EBCB8B" font-size="16">||</text>
    <text x="225" y="42" fill="#EBCB8B" font-size="8">0x18</text>

    <rect x="250" y="0" width="60" height="30" rx="4" fill="url(#scroll)" opacity="0.9"/>
    <text x="280" y="20" fill="#1a1a2e" font-size="10" text-anchor="middle">1.2.1</text>

    <text x="318" y="20" fill="#A3BE8C" font-size="16">|</text>

    <rect x="330" y="0" width="60" height="30" rx="4" fill="url(#scroll)" opacity="0.9"/>
    <text x="360" y="20" fill="#1a1a2e" font-size="10" text-anchor="middle">1.2.2</text>

    <text x="398" y="20" fill="#B48EAD" font-size="16">|||</text>
    <text x="395" y="42" fill="#B48EAD" font-size="8">0x19</text>

    <rect x="420" y="0" width="60" height="30" rx="4" fill="url(#scroll)" opacity="0.9"/>
    <text x="450" y="20" fill="#1a1a2e" font-size="10" text-anchor="middle">2.1.1</text>

    <text x="488" y="20" fill="#A3BE8C" font-size="16">|</text>

    <rect x="500" y="0" width="60" height="30" rx="4" fill="url(#scroll)" opacity="0.9"/>
    <text x="530" y="20" fill="#1a1a2e" font-size="10" text-anchor="middle">2.1.2</text>

    <text x="570" y="15" fill="#555" font-size="14">...</text>

    <!-- Arrow showing direction -->
    <line x1="0" y1="50" x2="580" y2="50" stroke="#444" stroke-width="1" stroke-dasharray="4"/>
    <text x="290" y="65" fill="#555" font-size="10" text-anchor="middle">sequential read: O(n) scan with delimiter counting</text>
  </g>

  <!-- ═══ RIGHT SIDE: 9D Runtime (in memory) ═══ -->
  <text x="30" y="230" fill="#EBCB8B" font-size="14" font-weight="bold">AT RUNTIME: Hierarchical Hash Table</text>
  <text x="30" y="248" fill="#666" font-size="11">Delimiters parsed into coordinate → offset map</text>

  <!-- Hash table visualization -->
  <g transform="translate(40, 265)">
    <!-- Book level -->
    <rect x="0" y="0" width="180" height="28" rx="4" fill="url(#book)" opacity="0.3" stroke="#B48EAD" stroke-width="1"/>
    <text x="90" y="18" fill="#B48EAD" font-size="11" text-anchor="middle">Chapter 1 (0x19 boundary)</text>

    <!-- Section boxes inside -->
    <rect x="10" y="35" width="140" height="24" rx="3" fill="url(#section)" opacity="0.3" stroke="#A3BE8C" stroke-width="1"/>
    <text x="80" y="51" fill="#A3BE8C" font-size="10" text-anchor="middle">Section 1 (0x18 boundary)</text>

    <rect x="160" y="35" width="140" height="24" rx="3" fill="url(#section)" opacity="0.3" stroke="#A3BE8C" stroke-width="1"/>
    <text x="230" y="51" fill="#A3BE8C" font-size="10" text-anchor="middle">Section 2</text>

    <!-- Scrolls inside sections -->
    <rect x="15" y="68" width="38" height="22" rx="3" fill="url(#scroll)" opacity="0.8"/>
    <text x="34" y="83" fill="#1a1a2e" font-size="9" text-anchor="middle">1.1.1</text>

    <rect x="58" y="68" width="38" height="22" rx="3" fill="url(#scroll)" opacity="0.8"/>
    <text x="77" y="83" fill="#1a1a2e" font-size="9" text-anchor="middle">1.1.2</text>

    <rect x="101" y="68" width="38" height="22" rx="3" fill="url(#scroll)" opacity="0.8"/>
    <text x="120" y="83" fill="#1a1a2e" font-size="9" text-anchor="middle">1.1.3</text>

    <rect x="165" y="68" width="38" height="22" rx="3" fill="url(#scroll)" opacity="0.8"/>
    <text x="184" y="83" fill="#1a1a2e" font-size="9" text-anchor="middle">1.2.1</text>

    <rect x="208" y="68" width="38" height="22" rx="3" fill="url(#scroll)" opacity="0.8"/>
    <text x="227" y="83" fill="#1a1a2e" font-size="9" text-anchor="middle">1.2.2</text>

    <!-- Chapter 2 -->
    <rect x="330" y="0" width="180" height="28" rx="4" fill="url(#book)" opacity="0.3" stroke="#B48EAD" stroke-width="1"/>
    <text x="420" y="18" fill="#B48EAD" font-size="11" text-anchor="middle">Chapter 2</text>

    <rect x="340" y="35" width="140" height="24" rx="3" fill="url(#section)" opacity="0.3" stroke="#A3BE8C" stroke-width="1"/>
    <text x="410" y="51" fill="#A3BE8C" font-size="10" text-anchor="middle">Section 1</text>

    <rect x="345" y="68" width="38" height="22" rx="3" fill="url(#scroll)" opacity="0.8"/>
    <text x="364" y="83" fill="#1a1a2e" font-size="9" text-anchor="middle">2.1.1</text>

    <rect x="388" y="68" width="38" height="22" rx="3" fill="url(#scroll)" opacity="0.8"/>
    <text x="407" y="83" fill="#1a1a2e" font-size="9" text-anchor="middle">2.1.2</text>

    <!-- Lookup arrow -->
    <text x="560" y="10" fill="#88C0D0" font-size="11">lookup("1.2.1")</text>
    <line x1="555" y1="15" x2="200" y2="78" stroke="#88C0D0" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
  </g>

  <!-- ═══ BOTTOM: Information Propagation ═══ -->
  <text x="30" y="400" fill="#EBCB8B" font-size="14" font-weight="bold">PROPAGATION: No Sync Needed</text>
  <text x="30" y="418" fill="#666" font-size="11">Each node holds a complete phext. Writes are local. Sync is file copy.</text>

  <g transform="translate(40, 435)">
    <!-- Node A -->
    <rect x="0" y="0" width="160" height="80" rx="6" fill="none" stroke="#88C0D0" stroke-width="1.5"/>
    <text x="80" y="20" fill="#88C0D0" font-size="11" text-anchor="middle" font-weight="bold">Node A (Chrys)</text>
    <rect x="10" y="30" width="30" height="18" rx="2" fill="url(#scroll)" opacity="0.7"/>
    <rect x="45" y="30" width="30" height="18" rx="2" fill="url(#scroll)" opacity="0.7"/>
    <rect x="80" y="30" width="30" height="18" rx="2" fill="url(#scroll)" opacity="0.7"/>
    <rect x="115" y="30" width="30" height="18" rx="2" fill="url(#scroll)" opacity="0.7"/>
    <text x="80" y="65" fill="#555" font-size="9" text-anchor="middle">full phext (local)</text>

    <!-- Arrow A→B -->
    <line x1="170" y1="40" x2="240" y2="40" stroke="#A3BE8C" stroke-width="1.5" marker-end="url(#arrowG)"/>
    <text x="205" y="32" fill="#A3BE8C" font-size="9" text-anchor="middle">rsync</text>
    <text x="205" y="58" fill="#555" font-size="9" text-anchor="middle">or git push</text>

    <!-- Node B -->
    <rect x="250" y="0" width="160" height="80" rx="6" fill="none" stroke="#88C0D0" stroke-width="1.5"/>
    <text x="330" y="20" fill="#88C0D0" font-size="11" text-anchor="middle" font-weight="bold">Node B (Phex)</text>
    <rect x="260" y="30" width="30" height="18" rx="2" fill="url(#scroll)" opacity="0.7"/>
    <rect x="295" y="30" width="30" height="18" rx="2" fill="url(#scroll)" opacity="0.7"/>
    <rect x="330" y="30" width="30" height="18" rx="2" fill="url(#scroll)" opacity="0.7"/>
    <rect x="365" y="30" width="30" height="18" rx="2" fill="url(#scroll)" opacity="0.7"/>
    <text x="330" y="65" fill="#555" font-size="9" text-anchor="middle">full phext (local)</text>

    <!-- Arrow B→C -->
    <line x1="420" y1="40" x2="490" y2="40" stroke="#A3BE8C" stroke-width="1.5" marker-end="url(#arrowG)"/>
    <text x="455" y="32" fill="#A3BE8C" font-size="9" text-anchor="middle">SQ mesh</text>

    <!-- Node C -->
    <rect x="500" y="0" width="160" height="80" rx="6" fill="none" stroke="#88C0D0" stroke-width="1.5"/>
    <text x="580" y="20" fill="#88C0D0" font-size="11" text-anchor="middle" font-weight="bold">Node C (Verse)</text>
    <rect x="510" y="30" width="30" height="18" rx="2" fill="url(#scroll)" opacity="0.7"/>
    <rect x="545" y="30" width="30" height="18" rx="2" fill="url(#scroll)" opacity="0.7"/>
    <rect x="580" y="30" width="30" height="18" rx="2" fill="url(#scroll)" opacity="0.7"/>
    <rect x="615" y="30" width="30" height="18" rx="2" fill="url(#scroll)" opacity="0.7"/>
    <text x="580" y="65" fill="#555" font-size="9" text-anchor="middle">full phext (local)</text>
  </g>

  <!-- Key insight callout -->
  <rect x="40" y="550" width="820" height="55" rx="6" fill="rgba(180,142,173,0.1)" stroke="#B48EAD" stroke-width="1"/>
  <text x="450" y="572" fill="#B48EAD" font-size="12" text-anchor="middle" font-weight="bold">Key: There is no tree. Every scroll is a leaf. Delimiters create boundaries, not hierarchy.</text>
  <text x="450" y="590" fill="#888" font-size="11" text-anchor="middle">Pairwise sync = copy the file. Coordinate lookup = parse delimiters into hash map. O(1) access at runtime.</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#88C0D0"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A3BE8C"/>
    </marker>
  </defs>
</svg>
