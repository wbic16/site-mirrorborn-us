<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phext Coordinate Space — 3D Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e8e0cc;
    font-family: 'Georgia', serif;
    overflow: hidden;
  }
  
  #info {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(10, 10, 15, 0.85);
    border: 1px solid #2a2a3a;
    padding: 1rem 1.5rem;
    border-radius: 4px;
    max-width: 350px;
    z-index: 10;
  }
  
  #info h1 {
    font-size: 1.2rem;
    color: #c8a96e;
    margin-bottom: 0.5rem;
    letter-spacing: 0.05em;
  }
  
  #info p {
    font-size: 0.9rem;
    color: #9a9ab0;
    line-height: 1.5;
    margin-bottom: 0.5rem;
  }
  
  #coordinate {
    font-family: 'Courier New', monospace;
    font-size: 1.1rem;
    color: #c8a96e;
    padding: 0.5rem;
    background: rgba(42, 42, 58, 0.3);
    border-radius: 3px;
    margin-top: 0.5rem;
  }
  
  #breadcrumb {
    font-size: 0.85rem;
    color: #8888aa;
    margin-top: 0.3rem;
    font-family: 'Courier New', monospace;
  }
  
  .controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.5rem;
    z-index: 10;
  }
  
  .btn {
    background: rgba(42, 42, 58, 0.9);
    border: 1px solid #4a4a6a;
    color: #c8a96e;
    padding: 0.6rem 1.2rem;
    border-radius: 3px;
    cursor: pointer;
    font-family: 'Georgia', serif;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  
  .btn:hover {
    background: rgba(52, 52, 68, 1);
    border-color: #c8a96e;
  }
  
  .btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  
  #legend {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(10, 10, 15, 0.85);
    border: 1px solid #2a2a3a;
    padding: 0.8rem 1rem;
    border-radius: 4px;
    font-size: 0.85rem;
    z-index: 10;
  }
  
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.4rem;
  }
  
  .legend-item:last-child {
    margin-bottom: 0;
  }
  
  .legend-box {
    width: 14px;
    height: 14px;
    border-radius: 2px;
  }
  
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>

<div id="info">
  <h1>Phext Coordinate Space</h1>
  <p>9×9×9 fractal structure. Click any node to zoom in.</p>
  <div id="coordinate">1.1.1/1.1.1/1.1.1</div>
  <div id="breadcrumb">Root</div>
</div>

<div class="controls">
  <button class="btn" id="btn-back" onclick="zoomOut()" disabled>← Back</button>
  <button class="btn" onclick="resetView()">Reset View</button>
  <button class="btn" onclick="toggleRotation()">⟳ Auto-Rotate</button>
</div>

<div id="legend">
  <div class="legend-item">
    <div class="legend-box" style="background: #c8a96e;"></div>
    <span style="color: #c8a96e;">Reserved</span>
  </div>
  <div class="legend-item">
    <div class="legend-box" style="background: #88aaff;"></div>
    <span style="color: #88aaff;">Populated</span>
  </div>
  <div class="legend-item">
    <div class="legend-box" style="background: rgba(136, 136, 170, 0.2);"></div>
    <span style="color: #8888aa;">Empty</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Coordinate space state
let currentPath = [];
let scene, camera, renderer, raycaster, mouse;
let cubeGroup;
let autoRotate = true;
let nodes = [];

// Reserved coordinates (Shell of Nine, known locations)
const reserved = new Set([
  '1.1.1', '1.5.2', '2.3.5', '3.1.4', 
  '9.1.1', '9.9.9', '0.0.0'
]);

// Simulated populated coordinates (would come from SQ in production)
const populated = new Set([
  '1.2.3', '4.5.6', '7.8.9',
  '2.4.6', '1.3.5', '9.7.3'
]);

function init() {
  // Scene setup
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0f);
  
  // Camera
  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(15, 15, 15);
  camera.lookAt(0, 0, 0);
  
  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  
  // Raycaster for click detection
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();
  
  // Lights
  const ambient = new THREE.AmbientLight(0x404050, 0.6);
  scene.add(ambient);
  
  const light1 = new THREE.PointLight(0xc8a96e, 0.8, 100);
  light1.position.set(20, 20, 20);
  scene.add(light1);
  
  const light2 = new THREE.PointLight(0x88aaff, 0.5, 100);
  light2.position.set(-20, -10, -20);
  scene.add(light2);
  
  // Build initial 9x9x9 cube
  buildCube();
  
  // Event listeners
  window.addEventListener('resize', onWindowResize);
  renderer.domElement.addEventListener('click', onNodeClick);
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  
  // Start animation
  animate();
}

function buildCube() {
  // Clear existing cube
  if (cubeGroup) {
    scene.remove(cubeGroup);
  }
  
  cubeGroup = new THREE.Group();
  nodes = [];
  
  // Create 9×9×9 grid
  for (let x = 1; x <= 9; x++) {
    for (let y = 1; y <= 9; y++) {
      for (let z = 1; z <= 9; z++) {
        const coord = getCoordinateString(x, y, z);
        const fullCoord = getFullCoordinate(x, y, z);
        
        // Determine node type
        let color, opacity, size;
        if (reserved.has(coord)) {
          color = 0xc8a96e;
          opacity = 0.9;
          size = 0.4;
        } else if (populated.has(coord)) {
          color = 0x88aaff;
          opacity = 0.7;
          size = 0.35;
        } else {
          color = 0x8888aa;
          opacity = 0.15;
          size = 0.25;
        }
        
        // Create node
        const geometry = new THREE.BoxGeometry(size, size, size);
        const material = new THREE.MeshPhongMaterial({
          color: color,
          transparent: true,
          opacity: opacity,
          emissive: color,
          emissiveIntensity: 0.2
        });
        
        const cube = new THREE.Mesh(geometry, material);
        
        // Position in grid (centered at origin)
        cube.position.set(
          (x - 5) * 1.5,
          (y - 5) * 1.5,
          (z - 5) * 1.5
        );
        
        // Store coordinate data
        cube.userData = {
          x, y, z,
          coord: coord,
          fullCoord: fullCoord
        };
        
        cubeGroup.add(cube);
        nodes.push(cube);
      }
    }
  }
  
  scene.add(cubeGroup);
  updateCoordinateDisplay();
}

function getCoordinateString(x, y, z) {
  return `${x}.${y}.${z}`;
}

function getFullCoordinate(x, y, z) {
  const path = currentPath.join('/');
  const current = `${x}.${y}.${z}`;
  return path ? `${path}/${current}` : current;
}

function onNodeClick(event) {
  // Calculate mouse position in normalized device coordinates
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  
  // Raycast to find intersected nodes
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(nodes);
  
  if (intersects.length > 0) {
    const selected = intersects[0].object;
    zoomIn(selected.userData.x, selected.userData.y, selected.userData.z);
  }
}

function onMouseMove(event) {
  // Highlight on hover
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(nodes);
  
  // Reset all opacities
  nodes.forEach(node => {
    const coord = node.userData.coord;
    if (reserved.has(coord)) {
      node.material.opacity = 0.9;
    } else if (populated.has(coord)) {
      node.material.opacity = 0.7;
    } else {
      node.material.opacity = 0.15;
    }
  });
  
  // Highlight hovered
  if (intersects.length > 0) {
    intersects[0].object.material.opacity = 1.0;
    document.getElementById('coordinate').textContent = 
      intersects[0].object.userData.fullCoord;
  } else {
    updateCoordinateDisplay();
  }
}

function zoomIn(x, y, z) {
  const newCoord = getCoordinateString(x, y, z);
  currentPath.push(newCoord);
  buildCube();
  document.getElementById('btn-back').disabled = false;
}

function zoomOut() {
  if (currentPath.length > 0) {
    currentPath.pop();
    buildCube();
    if (currentPath.length === 0) {
      document.getElementById('btn-back').disabled = true;
    }
  }
}

function resetView() {
  currentPath = [];
  buildCube();
  document.getElementById('btn-back').disabled = true;
}

function toggleRotation() {
  autoRotate = !autoRotate;
}

function updateCoordinateDisplay() {
  const current = currentPath.length > 0 ? 
    currentPath[currentPath.length - 1] : '1.1.1';
  const full = currentPath.join('/') || '1.1.1/1.1.1/1.1.1';
  
  document.getElementById('coordinate').textContent = full;
  
  const breadcrumb = currentPath.length === 0 ? 'Root' :
    currentPath.length === 1 ? 'Level 1 (Volume)' :
    currentPath.length === 2 ? 'Level 2 (Chapter)' :
    'Level 3 (Page)';
  
  document.getElementById('breadcrumb').textContent = breadcrumb;
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  
  if (autoRotate && cubeGroup) {
    cubeGroup.rotation.y += 0.002;
    cubeGroup.rotation.x += 0.001;
  }
  
  renderer.render(scene, camera);
}

// Initialize on load
init();
</script>

</body>
</html>
