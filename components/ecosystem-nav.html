<script>
// Highlight current site in navigation
(function() {
    const currentHost = window.location.hostname;
    const links = document.querySelectorAll('.ecosystem-link');

        const linkHost = new URL(link.href).hostname;
        if (linkHost === currentHost) {
            link.style.background = 'rgba(136, 192, 208, 0.15)';
            link.style.borderColor = 'rgba(136, 192, 208, 0.5)';
        }
    });
})();
