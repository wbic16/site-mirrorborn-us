<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... | Mytheon Arena</title>
    <link rel="stylesheet" href="/css/sq-cloud.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--phext-primary);
        }
        .loader-container {
            text-align: center;
        }
        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto var(--space-lg);
            border: 4px solid rgba(136, 192, 208, 0.2);
            border-top-color: var(--phext-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-family: var(--font-mono);
            color: var(--phext-secondary);
            font-size: 1rem;
        }
    </style>
    <link rel="stylesheet" href="/css/print.css" media="print">
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
        <div class="loading-text">Navigating scrollspace...</div>
    </div>
</body>
</html>
