<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>💎 Phext Editor • Mirrorborn</title>
<link rel="stylesheet" href="/css/main.css">
<style>
:root {
  --bg: #171717; --panel: #131313; --bar: #1c1c1c; --border: #2e2e2e;
  --text: #dedede; --dim: #808080; --coord: #d4a855;
  --z-color: #4dc9c9; --y-color: #c964c9; --x-color: #6bc96b;
  --active: #e8c547; --danger: #e05555;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 13px; height: 100vh;
  display: flex; flex-direction: column; overflow: hidden;
}

/* ── Connect screen ── */
#connect-screen {
  display: flex; align-items: center; justify-content: center;
  flex: 1;
}
#connect-screen .box {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 32px; max-width: 420px; width: 100%;
}
#connect-screen h1 { color: var(--coord); font-size: 20px; margin-bottom: 6px; }
#connect-screen .sub { color: var(--dim); font-size: 12px; margin-bottom: 20px; }
#connect-screen label { color: var(--dim); font-size: 11px; display: block; margin-bottom: 4px; }
#connect-screen input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  color: var(--text); font-family: inherit; font-size: 13px;
  padding: 8px 12px; border-radius: 4px; outline: none; margin-bottom: 12px;
}
#connect-screen input:focus { border-color: var(--coord); }
#connect-screen button {
  width: 100%; background: var(--z-color); color: #000;
  border: none; padding: 10px; border-radius: 4px;
  font-family: inherit; font-size: 13px; font-weight: bold;
  cursor: pointer;
}
#connect-screen button:hover { background: #5ed5d5; }
#connect-screen .error { color: var(--danger); font-size: 12px; margin-top: 8px; }
#connect-screen .saved { color: var(--dim); font-size: 11px; margin-top: 12px; }
#connect-screen .saved a { color: var(--z-color); cursor: pointer; }

/* ── Editor frame ── */
#editor-frame {
  display: none; flex: 1; width: 100%;
}
#editor-frame iframe {
  width: 100%; height: 100%; border: none;
}
</style>
</head>
<body>

<div id="connect-screen">
  <div class="box">
    <h1>💎 Phext Editor</h1>
    <div class="sub">Connect to a phext-edit server on your ranch</div>

    <label>Server URL</label>
    <input id="server-url" placeholder="http://aletheia-core:8080" autocomplete="off" />

    <label>Access Token</label>
    <input id="server-token" type="password" placeholder="your token" autocomplete="off" />

    <button onclick="connect()">Connect</button>
    <div class="error" id="connect-error"></div>

    <div class="saved" id="saved-connections"></div>
  </div>
</div>

<div id="editor-frame">
  <iframe id="editor-iframe" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
</div>

<script>
const $ = id => document.getElementById(id);

// Load saved connections
const saved = JSON.parse(localStorage.getItem('phext-connections') || '[]');
if (saved.length) {
  let html = 'Recent: ';
  html += saved.map(s =>
    `<a onclick="quickConnect('${s.url}','${s.token}')">${new URL(s.url).hostname}</a>`
  ).join(' · ');
  $('saved-connections').innerHTML = html;
}

// Pre-fill from last connection
if (saved.length) {
  $('server-url').value = saved[0].url;
  $('server-token').value = saved[0].token;
}

async function connect() {
  const url = $('server-url').value.trim().replace(/\/$/, '');
  const token = $('server-token').value.trim();

  if (!url) { $('connect-error').textContent = 'Enter server URL'; return; }

  try {
    const headers = {};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(url + '/api/status', { headers });

    if (res.status === 401) {
      $('connect-error').textContent = 'Invalid token';
      return;
    }

    const data = await res.json();
    if (!data.scrolls && data.scrolls !== 0) {
      $('connect-error').textContent = 'Not a phext-edit server';
      return;
    }

    // Save connection
    const newSaved = [{ url, token }, ...saved.filter(s => s.url !== url)].slice(0, 5);
    localStorage.setItem('phext-connections', JSON.stringify(newSaved));

    // Show the editor — load the embedded UI from the server, with token in hash
    $('connect-screen').style.display = 'none';
    $('editor-frame').style.display = 'flex';

    // The phext-edit server embeds its own full UI at /
    // We pass the token so the iframe can authenticate
    const iframe = $('editor-iframe');

    // Load the server's built-in UI directly
    // Store token in localStorage for the iframe's domain
    iframe.src = url + '/';

    // After iframe loads, inject the auth token
    iframe.onload = () => {
      try {
        iframe.contentWindow.postMessage({ type: 'phext-auth', token }, url);
      } catch(e) {
        // Cross-origin — need the server's UI to read token from URL
      }
    };

  } catch(e) {
    $('connect-error').textContent = 'Connection failed: ' + e.message;
  }
}

function quickConnect(url, token) {
  $('server-url').value = url;
  $('server-token').value = token;
  connect();
}

// Enter to connect
$('server-url').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
$('server-token').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
</script>
</body>
</html>
