<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#88C0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B48EAD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Simple lattice representation -->
  <rect width="32" height="32" fill="#2E3440"/>
  <g stroke="url(#iconGradient)" stroke-width="2" fill="none">
    <rect x="6" y="6" width="10" height="10" opacity="0.7"/>
    <rect x="16" y="16" width="10" height="10" opacity="0.7"/>
    <line x1="6" y1="6" x2="16" y2="16"/>
    <line x1="16" y1="6" x2="26" y2="16"/>
    <line x1="6" y1="16" x2="16" y2="26"/>
  </g>
  <circle cx="16" cy="16" r="2" fill="#88C0D0"/>
</svg>
